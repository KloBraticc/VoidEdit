name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            source: target/release/voidedit.exe
            asset: voidedit-windows-x64.exe
          - os: ubuntu-22.04
            source: target/release/voidedit
            asset: voidedit-linux-x64
          - os: macos-14
            source: target/release/voidedit
            asset: voidedit-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - run: cargo test --workspace --release
      - run: cargo build --release -p voidedit
      - run: cp ${{ matrix.source }} ${{ matrix.asset }}
        shell: bash
      - run: gh release create ${{ github.ref_name }} --verify-tag --title ${{ github.ref_name }} --notes "" || true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload ${{ github.ref_name }} ${{ matrix.asset }} --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
