[package]
name = "voidedit-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon.workspace = true
voidedit-core.workspace = true
voidedit-render.workspace = true
voidedit-media.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
filmcraft-h264enc = { git = "https://github.com/storytold/filmcraft", rev = "5ed4952" }
filmcraft-aac = { git = "https://github.com/storytold/filmcraft", rev = "5ed4952" }
filmcraft-isobmff = { git = "https://github.com/storytold/filmcraft", rev = "5ed4952" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }
